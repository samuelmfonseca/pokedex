[package]
name = "pokedex"
version = "1.1.0"
edition = "2021"
description = "Pokédex com time de Pokémon persistido em SQLite (backend Rust + Axum)"
license = "MIT"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.6", features = ["fs", "cors"] }

[profile.release]
strip = true
lto = true
