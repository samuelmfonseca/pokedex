name: CI - Testes

on:
  pull_request:
  push:
    branches: [main]

jobs:
  testes:
    name: Testes automatizados (cargo test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Rodar testes
        run: cargo test --locked
